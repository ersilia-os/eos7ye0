Title: ChemFH chemical frequent hitter detection
Description: Screens a compound for the behaviours that manufacture false 
  positives in biochemical assays, returning learned predictions for colloidal 
  aggregation, firefly luciferase inhibition, blue and green fluorescence, 
  reactivity, promiscuity and residual assay interference, alongside hits 
  against ten classical substructure filters including PAINS, BMS and Lilly 
  MedChem. Shi and colleagues trained multi-task directed message-passing 
  networks on 823,391 compounds, averaging an AUC of 0.91. A flag marks a known 
  interference mechanism, not a spurious result.
