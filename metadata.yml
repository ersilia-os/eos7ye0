Title: ChemFH chemical frequent hitter detection
Description: Screens a compound for the behaviours that generate false positives in biochemical assays, covering colloidal aggregation, luciferase inhibition, fluorescence interference, reactivity and promiscuous binding across seventeen readouts. ChemFH assembles curated frequent-hitter data behind a single interface so that suspect compounds can be set aside before resources are spent chasing them. A flag indicates a recognised interference mechanism, not that a measured activity is necessarily spurious.
